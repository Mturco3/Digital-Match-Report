<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Match Report - Game</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f4225" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="match-screen" class="screen active">
  <div class="match-header">
    <div class="match-top-actions">
      <button class="half-btn" id="go-history-from-match-btn">Partite salvate</button>
      <div class="header-right-actions">
        <button class="half-btn" id="export-btn">Esporta</button>
        <button class="half-btn" id="end-game-btn">Fine gara</button>
      </div>
    </div>
    <div class="header-lang-switch">
      <div class="lang-switch in-header" id="lang-switch" role="group" aria-label="Language switch">
        <button id="lang-it-btn" class="lang-btn" data-lang="it" type="button" aria-label="Italiano" aria-pressed="false"><svg class="lang-flag" viewBox="0 0 3 2" aria-hidden="true" focusable="false"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg><span>IT</span></button>
        <button id="lang-en-btn" class="lang-btn" data-lang="en" type="button" aria-label="English" aria-pressed="false"><svg class="lang-flag" viewBox="0 0 60 40" aria-hidden="true" focusable="false"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="13"/><path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="8"/></svg><span>EN</span></button>
      </div>
    </div>
    <div class="match-meta" id="match-meta-text">—</div>
    <div class="scoreboard">
      <div class="team-name home">
        <span class="team-crest" id="crest-disp-home"></span>
        <span id="disp-home">Home</span>
      </div>
      <div class="score-display">
        <div class="score-num" id="score-home">0</div>
        <div class="score-sep">–</div>
        <div class="score-num" id="score-away">0</div>
      </div>
      <div class="team-name away">
        <span class="team-crest" id="crest-disp-away"></span>
        <span id="disp-away">Away</span>
      </div>
    </div>
    <div class="half-indicator" id="half-indicator" aria-live="polite"></div>
  </div>

  <div class="match-summary-wrap">
    <div class="stat-card">
      <label class="summary-label" id="lbl-added-first" for="summary-added-first">Recupero primo tempo</label>
      <div class="stat-control">
        <button type="button" class="stepper-btn" data-target="summary-added-first" data-step="down">&minus;</button>
        <span class="stat-plus" aria-hidden="true">+</span>
        <input type="number" min="0" max="30" id="summary-added-first" class="summary-input" inputmode="numeric" />
        <span class="stat-unit" aria-hidden="true">min</span>
        <button type="button" class="stepper-btn" data-target="summary-added-first" data-step="up">+</button>
      </div>
    </div>
    <div class="stat-card">
      <label class="summary-label" id="lbl-added-second" for="summary-added-second">Recupero secondo tempo</label>
      <div class="stat-control">
        <button type="button" class="stepper-btn" data-target="summary-added-second" data-step="down">&minus;</button>
        <span class="stat-plus" aria-hidden="true">+</span>
        <input type="number" min="0" max="30" id="summary-added-second" class="summary-input" inputmode="numeric" />
        <span class="stat-unit" aria-hidden="true">min</span>
        <button type="button" class="stepper-btn" data-target="summary-added-second" data-step="up">+</button>
      </div>
    </div>
    <div class="stat-card team-home">
      <span class="summary-label" id="lbl-subs-home">Totale cambi casa</span>
      <strong class="stat-value" id="summary-subs-home">0</strong>
    </div>
    <div class="stat-card team-away">
      <span class="summary-label" id="lbl-subs-away">Totale cambi ospiti</span>
      <strong class="stat-value" id="summary-subs-away">0</strong>
    </div>
  </div>

  <div class="pitch-area">
    <div class="team-col home">
      <div class="team-col-header"><span id="col-home-name">Home</span></div>
      <div class="events-list" id="events-home"></div>
    </div>
    <div class="team-col away">
      <div class="team-col-header"><span id="col-away-name">Away</span></div>
      <div class="events-list" id="events-away"></div>
    </div>
  </div>

  <div class="fab-spacer"></div>

  <div class="fab-container">
    <div class="fab-group home">
      <button class="fab home-fab" id="home-fab" type="button" aria-labelledby="fab-home-label">+</button>
      <span class="fab-label" id="fab-home-label">Home</span>
    </div>
    <div class="fab-group away">
      <button class="fab away-fab" id="away-fab" type="button" aria-labelledby="fab-away-label">+</button>
      <span class="fab-label" id="fab-away-label">Away</span>
    </div>
  </div>
</div>

<div class="modal-overlay" id="event-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Aggiungi evento – Home</div>

    <div class="event-type-grid">
      <div class="type-btn selected" data-type="card" id="type-card">
        <div class="type-icon type-card"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="2" width="10" height="16" rx="2" fill="#f5c518"/></svg></div>
        <div class="type-label" id="lbl-type-card">Cartellino</div>
      </div>
      <div class="type-btn" data-type="goal" id="type-goal">
        <div class="type-icon type-goal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5l3.8 2.8-1.5 4.4H9.7l-1.5-4.4z" fill="currentColor"/></svg></div>
        <div class="type-label" id="lbl-type-goal">Goal</div>
      </div>
      <div class="type-btn" data-type="sub" id="type-sub">
        <div class="type-icon type-sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 19V6m0 0L4.5 9.5M8 6l3.5 3.5M16 5v13m0 0l-3.5-3.5M16 18l3.5-3.5"/></svg></div>
        <div class="type-label" id="lbl-type-sub">Sostituzione</div>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="modal-field shared-half-field">
      <label id="lbl-event-half">Tempo</label>
      <select id="f-event-half"></select>
    </div>

    <div class="modal-fields" id="fields-card">
      <div class="modal-field">
        <label id="lbl-card-type">Tipo cartellino</label>
        <div class="card-type-row">
          <div class="card-type-btn yellow selected" data-card-type="yellow" id="ct-yellow">Giallo</div>
          <div class="card-type-btn red" data-card-type="red" id="ct-red">Rosso</div>
        </div>
      </div>
      <div class="modal-field">
        <label id="lbl-card-number">Numero giocatore</label>
        <input type="number" id="f-card-player" placeholder="es. 10" min="1" max="99" />
      </div>
      <div class="modal-field">
        <label id="lbl-minute-card">Minuto</label>
        <input type="number" id="f-card-min" placeholder="es. 34" min="1" max="120" />
      </div>
    </div>

    <div class="modal-fields is-hidden" id="fields-goal">
      <div class="modal-field">
        <label id="lbl-minute-goal">Minuto</label>
        <input type="number" id="f-goal-min" placeholder="es. 67" min="1" max="120" />
      </div>
    </div>

    <div class="modal-fields is-hidden" id="fields-sub">
      <div class="modal-field">
        <label id="lbl-sub-out">Numero uscita</label>
        <input type="number" id="f-sub-out" placeholder="es. 8" min="1" max="99" />
      </div>
      <div class="modal-field">
        <label id="lbl-sub-in">Numero entrata</label>
        <input type="number" id="f-sub-in" placeholder="es. 18" min="1" max="99" />
      </div>
      <div class="modal-field">
        <label id="lbl-minute-sub">Minuto</label>
        <input type="number" id="f-sub-min" placeholder="es. 55" min="1" max="120" />
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="cancel-event-btn">Annulla</button>
      <button class="btn-save" id="save-event-btn">Aggiungi evento</button>
    </div>
  </div>
</div>

<div class="modal-overlay warn-overlay" id="warn-modal" role="alertdialog" aria-labelledby="warn-title" aria-describedby="warn-text">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title warn-title"><span aria-hidden="true">⚠</span> <span id="warn-title">Seconda ammonizione</span></div>
    <p class="warn-text" id="warn-text"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="warn-cancel-btn">Annulla</button>
      <button class="btn-danger" id="warn-confirm-btn">Conferma e registra il rosso</button>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/teams.js"></script>
<script src="js/game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
