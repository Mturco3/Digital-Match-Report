<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Match Report</title>
  <meta name="description" content="Mobile-first web app for football referees: log goals, cards and substitutions during a match and print a clean match summary. Works offline, no account needed." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f4225" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="lang-switch" id="lang-switch" role="group" aria-label="Language switch">
  <button id="lang-it-btn" class="lang-btn" data-lang="it" type="button" aria-label="Italiano" aria-pressed="false"><svg class="lang-flag" viewBox="0 0 3 2" aria-hidden="true" focusable="false"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg><span>IT</span></button>
  <button id="lang-en-btn" class="lang-btn" data-lang="en" type="button" aria-label="English" aria-pressed="false"><svg class="lang-flag" viewBox="0 0 60 40" aria-hidden="true" focusable="false"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="13"/><path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="8"/></svg><span>EN</span></button>
</div>

<div id="home-screen" class="screen active">
  <div class="setup-card home-card">
    <div class="setup-logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#1a6b3a"/>
        <circle cx="24" cy="24" r="18" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="24" cy="24" r="5" fill="none" stroke="white" stroke-width="1.5"/>
        <line x1="2" y1="24" x2="46" y2="24" stroke="white" stroke-width="1.5"/>
        <rect x="2" y="14" width="10" height="20" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
        <rect x="36" y="14" width="10" height="20" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
      </svg>
      <h1>Digital Match Report</h1>
      <p id="home-subtitle">Scheda offline</p>
    </div>

    <button class="btn-primary" id="go-new-game-btn">Nuova partita</button>
    <button class="btn-secondary" id="go-history-btn">Partite salvate</button>

    <div class="recent-section" id="recent-section" hidden>
      <h2 class="recent-title" id="recent-title">Partite recenti</h2>
      <div class="recent-list" id="recent-list"></div>
    </div>
  </div>
</div>

<div id="setup-screen" class="screen">
  <div class="setup-card">
    <div class="inline-actions">
      <button class="btn-link" id="back-home-from-setup-btn">← Menu</button>
    </div>

    <header class="setup-brand">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="#1a6b3a"/>
        <circle cx="24" cy="24" r="18" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="24" cy="24" r="5" fill="none" stroke="white" stroke-width="1.5"/>
        <line x1="2" y1="24" x2="46" y2="24" stroke="white" stroke-width="1.5"/>
        <rect x="2" y="14" width="10" height="20" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
        <rect x="36" y="14" width="10" height="20" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
      </svg>
      <h1>Digital Match Report</h1>
      <p id="setup-subtitle">Scheda gara</p>
    </header>

    <h2 class="form-section-title" id="sec-officials">Ufficiali di gara</h2>

    <div class="form-group">
      <div class="field-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="5"/><path d="M13 13l8-3v-3h-9"/><circle cx="8" cy="15" r="1.2" fill="currentColor"/></svg><label id="lbl-referee">Arbitro</label></div>
      <div class="form-row">
        <input type="text" id="inp-referee-first" autocomplete="off" />
        <input type="text" id="inp-referee-last" autocomplete="off" />
      </div>
    </div>
    <div class="form-group">
      <div class="field-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/></svg><label id="lbl-supervisor">Osservatore</label></div>
      <div class="form-row">
        <input type="text" id="inp-supervisor-first" autocomplete="off" />
        <input type="text" id="inp-supervisor-last" autocomplete="off" />
      </div>
    </div>
    <h2 class="form-section-title" id="sec-teams">Squadre</h2>
    <div class="form-group team-field">
      <div class="field-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg><label id="lbl-home" for="inp-home">Squadra casa</label></div>
      <div class="combo">
        <span class="combo-crest" id="crest-home"></span>
        <input type="text" id="inp-home" role="combobox" aria-expanded="false" aria-controls="list-home" aria-autocomplete="list" autocomplete="off" />
        <ul class="combo-list" id="list-home" role="listbox" hidden></ul>
      </div>
      <div class="color-row">
        <span class="color-label" id="color-label-home">Colore</span>
        <div class="swatches" id="swatches-home" role="radiogroup"></div>
        <input type="color" id="color-home" class="color-input" />
      </div>
      <p class="color-warning" id="warn-home" role="status" hidden></p>
    </div>
    <div class="form-group team-field">
      <div class="field-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg><label id="lbl-away" for="inp-away">Squadra ospite</label></div>
      <div class="combo">
        <span class="combo-crest" id="crest-away"></span>
        <input type="text" id="inp-away" role="combobox" aria-expanded="false" aria-controls="list-away" aria-autocomplete="list" autocomplete="off" />
        <ul class="combo-list" id="list-away" role="listbox" hidden></ul>
      </div>
      <div class="color-row">
        <span class="color-label" id="color-label-away">Colore</span>
        <div class="swatches" id="swatches-away" role="radiogroup"></div>
        <input type="color" id="color-away" class="color-input" />
      </div>
      <p class="color-warning" id="warn-away" role="status" hidden></p>
    </div>
    <h2 class="form-section-title" id="sec-competition">Competizione</h2>
    <div class="form-row" id="category-row">
      <div class="form-group">
        <div class="field-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg><label id="lbl-category" for="inp-category">Categoria</label></div>
        <select id="inp-category"></select>
      </div>
      <div class="form-group" id="level-group">
        <div class="field-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h5v-5h5v-5h6"/></svg><label id="lbl-level" for="inp-level">Livello</label></div>
        <select id="inp-level"></select>
      </div>
    </div>
    <button class="btn-primary" id="start-match-btn">Inizia</button>
  </div>
</div>

<div id="history-screen" class="screen">
  <div class="history-wrap">
    <div class="history-head">
      <button class="btn-link" id="back-home-from-history-btn">← Menu</button>
      <h2 id="history-title">Partite salvate</h2>
    </div>
    <div id="history-list" class="history-list"></div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/teams.js"></script>
<script src="js/team-picker.js"></script>
<script src="js/home.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
