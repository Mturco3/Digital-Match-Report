<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Referee Card</title>
  <link rel="stylesheet" href="referee_scorecard.css" />
</head>
<body>

<div class="lang-switch" id="lang-switch" role="group" aria-label="Language switch">
  <button id="lang-it-btn" class="lang-btn" data-lang="it" type="button">🇮🇹 Italiano</button>
  <button id="lang-en-btn" class="lang-btn" data-lang="en" type="button">🇬🇧 English</button>
</div>

<div id="home-screen" class="screen active">
  <div class="setup-card home-card">
    <div class="setup-logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#1a6b3a"/>
        <circle cx="24" cy="24" r="18" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="24" cy="24" r="5" fill="none" stroke="white" stroke-width="1.5"/>
        <line x1="2" y1="24" x2="46" y2="24" stroke="white" stroke-width="1.5"/>
        <rect x="2" y="14" width="10" height="20" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
        <rect x="36" y="14" width="10" height="20" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
      </svg>
      <h1>Referee Card</h1>
      <p id="home-subtitle">Scheda offline</p>
    </div>

    <button class="btn-primary" id="go-new-game-btn">Nuova partita</button>
    <button class="btn-secondary" id="go-history-btn">Partite salvate</button>
  </div>
</div>

<div id="setup-screen" class="screen">
  <div class="setup-card">
    <div class="inline-actions">
      <button class="btn-link" id="back-home-from-setup-btn">← Menu</button>
    </div>

    <div class="setup-logo">
      <h1>Referee Card</h1>
      <p id="setup-subtitle">Scheda gara</p>
    </div>

    <div class="form-group">
      <label id="lbl-referee">Arbitro</label>
      <input type="text" id="inp-referee" placeholder="Nome completo" />
    </div>
    <div class="form-group">
      <label id="lbl-supervisor">Osservatore</label>
      <input type="text" id="inp-supervisor" placeholder="Nome completo" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label id="lbl-home">Squadra casa</label>
        <input type="text" id="inp-home" placeholder="Casa" />
      </div>
      <div class="form-group">
        <label id="lbl-away">Squadra ospite</label>
        <input type="text" id="inp-away" placeholder="Trasferta" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label id="lbl-category">Categoria</label>
        <select id="inp-category"></select>
      </div>
      <div class="form-group">
        <label id="lbl-level">Livello</label>
        <select id="inp-level"></select>
      </div>
    </div>
    <button class="btn-primary" id="start-match-btn">Inizia</button>
  </div>
</div>

<div id="history-screen" class="screen">
  <div class="history-wrap">
    <div class="history-head">
      <button class="btn-link" id="back-home-from-history-btn">← Menu</button>
      <h2 id="history-title">Partite salvate</h2>
    </div>
    <div id="history-list" class="history-list"></div>
  </div>
</div>

<script src="storage.js"></script>
<script src="referee_scorecard.js"></script>
</body>
</html>
